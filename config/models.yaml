# Models to compare. The names on the left are what you pass to --models.
#
# These run locally through Ollama (https://ollama.com): no API key, no rate limits.
# Ollama must be running, and each model must be pulled first:
#     ollama pull qwen3:8b
#     ollama pull llama3.1:8b
# Model tags change often. Run `ollama list` to see what you have, check the Ollama
# library for newer Qwen/Llama tags that fit your hardware, and edit the spec below.
#
# spec is "provider:model_id" (split on the first colon, so tags like qwen3:8b are fine).
# params are passed straight to the LangChain chat class (for ollama: ChatOllama).
models:
  qwen:
    spec: "ollama:qwen3:4b-instruct"
    params:
      temperature: 0.1
      base_url: "http://localhost:11434"   # only if Ollama is not on the default port
      reasoning: false
      num_predict: 300
      num_ctx: 2048
      num_thread: 8

  llama:
    spec: "ollama:llama3.2:1b"

  gemma:
    spec: "ollama:gemma3:4b"

  # Hosted free-tier examples (need `pip install -e ".[cloud]"` and the key in .env):
  gemini:
    spec: "google_genai:gemini-3.8-flash"     # GOOGLE_API_KEY
    parallel: 8
  # qwen-groq:
  #   spec: "groq:qwen/qwen3.8-27b"             # GROQ_API_KEY
